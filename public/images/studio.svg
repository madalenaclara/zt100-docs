<svg viewBox="0 0 1000 560" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="violet4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D5BD0"/><stop offset="1" stop-color="#8B7BE8"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="998" height="558" rx="16" fill="#ffffff" stroke="#E6E6EC"/>
  <!-- icon rail -->
  <rect x="2" y="2" width="58" height="556" rx="14" fill="#FBFBFD"/>
  <line x1="60" y1="2" x2="60" y2="558" stroke="#EEEEF2"/>
  <path d="M31 22 L42 42 L20 42 Z" fill="url(#violet4)"/>
  <g fill="#C5C7D0">
    <rect x="20" y="78" width="22" height="18" rx="4"/>
    <circle cx="31" cy="126" r="10"/>
  </g>
  <rect x="16" y="158" width="30" height="30" rx="9" fill="#EDEBFB"/>
  <path d="M33 164 l-9 12 h6 l-2 10 9 -12 h-6 z" fill="#6D5BD0"/>
  <g fill="#C5C7D0">
    <rect x="20" y="206" width="22" height="16" rx="4"/>
    <rect x="20" y="248" width="22" height="18" rx="4"/>
  </g>
  <circle cx="31" cy="530" r="13" fill="#E7E2F6"/>
  <!-- header -->
  <text x="92" y="58" fill="#2E2D3A" font-size="22" font-weight="700">Workflows</text>
  <!-- composer -->
  <rect x="92" y="80" width="872" height="92" rx="14" fill="#FAFAFD" stroke="#E2E2EA"/>
  <text x="114" y="118" fill="#A9AEBA" font-size="15">Describe what you want to automate, in plain words…</text>
  <text x="114" y="148" fill="#9AA0AE" font-size="12.5">e.g. "Every morning, summarise overnight emails and draft replies to the ones that need one."</text>
  <rect x="812" y="128" width="132" height="32" rx="9" fill="#6D5BD0"/>
  <text x="878" y="149" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Create workflow</text>
  <!-- library -->
  <text x="92" y="212" fill="#9AA0AE" font-size="12" letter-spacing="1.2" font-weight="700">YOUR WORKFLOWS</text>
  <!-- row 1 running -->
  <g transform="translate(92,228)">
    <rect x="0" y="0" width="872" height="80" rx="12" fill="#ffffff" stroke="#ECECF1"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#1F9D57"/>
    <text x="24" y="34" fill="#2E2D3A" font-size="16" font-weight="600">Morning inbox digest</text>
    <text x="24" y="58" fill="#8A8F9C" font-size="13">Summarise overnight email and draft the replies that are needed</text>
    <text x="640" y="46" fill="#A9AEBA" font-size="12.5">Every day · 7:00</text>
    <rect x="752" y="30" width="96" height="24" rx="12" fill="#E7F6ED"/>
    <circle cx="770" cy="42" r="4" fill="#1F9D57"/>
    <text x="784" y="46" fill="#1F9D57" font-size="12" font-weight="600">Running</text>
  </g>
  <!-- row 2 paused -->
  <g transform="translate(92,318)">
    <rect x="0" y="0" width="872" height="80" rx="12" fill="#ffffff" stroke="#ECECF1"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#E0A93B"/>
    <text x="24" y="34" fill="#2E2D3A" font-size="16" font-weight="600">Weekly client update</text>
    <text x="24" y="58" fill="#8A8F9C" font-size="13">Draft the Atlas Holdings status email from the week's meetings and notes</text>
    <text x="640" y="46" fill="#A9AEBA" font-size="12.5">Mondays · 9:00</text>
    <rect x="758" y="30" width="90" height="24" rx="12" fill="#FBF1DC"/>
    <circle cx="776" cy="42" r="4" fill="#E0A93B"/>
    <text x="790" y="46" fill="#B9852A" font-size="12" font-weight="600">Paused</text>
  </g>
  <!-- row 3 draft -->
  <g transform="translate(92,408)">
    <rect x="0" y="0" width="872" height="80" rx="12" fill="#ffffff" stroke="#ECECF1"/>
    <rect x="0" y="0" width="4" height="80" rx="2" fill="#C5C7D0"/>
    <text x="24" y="34" fill="#2E2D3A" font-size="16" font-weight="600">Meeting follow-ups</text>
    <text x="24" y="58" fill="#8A8F9C" font-size="13">Draft a follow-up email after each call, ready to review and send</text>
    <text x="640" y="46" fill="#A9AEBA" font-size="12.5">On meeting end</text>
    <rect x="762" y="30" width="86" height="24" rx="12" fill="#F1F1F4"/>
    <circle cx="780" cy="42" r="4" fill="#A9AEBA"/>
    <text x="794" y="46" fill="#6B7280" font-size="12" font-weight="600">Draft</text>
  </g>
</svg>
