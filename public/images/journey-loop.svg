<svg viewBox="0 0 1000 360" xmlns="http://www.w3.org/2000/svg" font-family="'Avenir Next', 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
  <rect x="1" y="1" width="998" height="358" rx="16" fill="#ffffff" stroke="#E6E6EC"/>
  <text x="500" y="44" fill="#2E2D3A" font-size="19" font-weight="800" text-anchor="middle">A loop, not a one-off</text>
  <!-- nodes -->
  <g>
    <g transform="translate(44,78)">
      <rect width="280" height="130" rx="14" fill="#EAF5FC" stroke="#D4E9F5"/>
      <circle cx="34" cy="36" r="16" fill="#3D99D4"/><text x="34" y="42" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">1</text>
      <text x="64" y="42" fill="#2E2D3A" font-size="16" font-weight="700">See where you stand</text>
      <text x="22" y="82" fill="#6B7280" font-size="12.5">Measure capability and</text>
      <text x="22" y="100" fill="#6B7280" font-size="12.5">make real usage visible.</text>
    </g>
    <g transform="translate(362,78)">
      <rect width="280" height="130" rx="14" fill="#FBFAE6" stroke="#ECE9C7"/>
      <circle cx="34" cy="36" r="16" fill="#EDE97B"/><text x="34" y="42" fill="#2E2D3A" font-size="16" font-weight="800" text-anchor="middle">2</text>
      <text x="64" y="42" fill="#2E2D3A" font-size="16" font-weight="700">Build the capability</text>
      <text x="22" y="82" fill="#6B7280" font-size="12.5">Train, practise and keep</text>
      <text x="22" y="100" fill="#6B7280" font-size="12.5">the organisation current.</text>
    </g>
    <g transform="translate(680,78)">
      <rect width="280" height="130" rx="14" fill="#EEF0F3" stroke="#DDE0E6"/>
      <circle cx="34" cy="36" r="16" fill="#2E2D3A"/><text x="34" y="42" fill="#fff" font-size="16" font-weight="800" text-anchor="middle">3</text>
      <text x="64" y="42" fill="#2E2D3A" font-size="16" font-weight="700">Put AI to work</text>
      <text x="22" y="82" fill="#6B7280" font-size="12.5">Turn daily work into</text>
      <text x="22" y="100" fill="#6B7280" font-size="12.5">assistants and agents.</text>
    </g>
  </g>
  <!-- forward arrows -->
  <g fill="#9CCBE6">
    <path d="M332 143 l12 7 l-12 7 z"/>
    <path d="M650 143 l12 7 l-12 7 z"/>
  </g>
  <!-- return loop -->
  <path d="M820 208 v70 a8 8 0 0 1 -8 8 H192 a8 8 0 0 1 -8 -8 v-70" fill="none" stroke="#3D99D4" stroke-width="2" stroke-dasharray="6 5"/>
  <path d="M184 222 l-7 -12 l14 0 z" fill="#3D99D4"/>
  <rect x="402" y="270" width="196" height="32" rx="16" fill="#EAF4FB"/>
  <text x="500" y="291" fill="#2C7099" font-size="13" font-weight="700" text-anchor="middle">Re-assess to track progress</text>
</svg>
